<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">EduAssist wireframe: login and register</title>
  <desc id="wfDesc">Split screen. Brand panel on the left; sign-in and create-account cards on the right.</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="0.5" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="blob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="brandAccent" gradientUnits="userSpaceOnUse" x1="61.5" y1="68" x2="71" y2="68">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Inter, 'Segoe UI', system-ui, sans-serif; fill: #334155; }
    .muted { fill: #475569; }
    .tiny { font-size: 11px; }
    .sm { font-size: 12px; }
    .base { font-size: 14px; }
    .lg { font-size: 16px; }
    .h2 { font-size: 22px; font-weight: 600; fill: #0F172A; }
    .h1 { font-size: 34px; font-weight: 600; fill: #FFFFFF; }
    .semibold { font-weight: 600; }
    .white { fill: #FFFFFF; }
    .brand { fill: #4F46E5; }
    .link { fill: #4F46E5; }
    .ph { fill: #64748B; }
  </style>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <g filter="url(#blob)" opacity="0.55">
    <circle cx="1150" cy="110" r="230" fill="#A5B4FC"/>
    <circle cx="390" cy="800" r="250" fill="#7DD3FC"/>
    <circle cx="900" cy="470" r="260" fill="#C4B5FD"/>
  </g>

  <!-- Brand panel -->
  <rect width="600" height="900" fill="#4F46E5"/>
  <rect x="48" y="48" width="40" height="40" rx="12" fill="#FFFFFF"/>
  <path d="M61.5 60.5h13M61.5 75.5h13M61.5 60.5v15" fill="none" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M61.5 68h9.5" fill="none" stroke="url(#brandAccent)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="102" y="76" font-size="20" font-weight="600" class="white">EduAssist</text>

  <text x="48" y="300" class="h1">Study from your</text>
  <text x="48" y="344" class="h1">own material.</text>
  <text x="48" y="392" font-size="15" fill="#E0E7FF">One place to ask, practise and plan.</text>

  <circle cx="58" cy="466" r="10" fill="#FFFFFF" fill-opacity="0.18"/>
  <path d="M53 466l4 4 7-8" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="471" font-size="14" fill="#FFFFFF">Cited answers, every time</text>

  <circle cx="58" cy="514" r="10" fill="#FFFFFF" fill-opacity="0.18"/>
  <path d="M53 514l4 4 7-8" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="519" font-size="14" fill="#FFFFFF">Quizzes that adapt to you</text>

  <circle cx="58" cy="562" r="10" fill="#FFFFFF" fill-opacity="0.18"/>
  <path d="M53 562l4 4 7-8" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="567" font-size="14" fill="#FFFFFF">A plan built around your exam</text>

  <text x="48" y="832" font-size="12" fill="#E0E7FF">Local model. Your material never leaves this device.</text>

  <!-- Sign in card -->
  <rect x="636" y="140" width="368" height="620" rx="16" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.9" filter="url(#glassShadow)"/>
  <text x="668" y="204" class="h2">Sign in</text>
  <text x="668" y="232" class="base muted">Welcome back to your course.</text>

  <text x="668" y="284" class="sm semibold">Email</text>
  <rect x="668" y="296" width="304" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.72" stroke="#CBD5E1"/>
  <text x="684" y="323" class="base ph">you@example.com</text>

  <text x="668" y="372" class="sm semibold">Password</text>
  <rect x="668" y="384" width="304" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.72" stroke="#CBD5E1"/>
  <text x="684" y="411" class="base ph">••••••••</text>

  <rect x="668" y="460" width="304" height="44" rx="10" fill="#4F46E5"/>
  <text x="820" y="487" text-anchor="middle" font-size="14" font-weight="600" class="white">Sign in</text>

  <text x="820" y="540" text-anchor="middle" class="sm muted">New here? <tspan class="link">Create an account</tspan></text>

  <line x1="668" y1="600" x2="972" y2="600" stroke="#E2E8F0"/>
  <text x="668" y="632" class="tiny muted">Error states</text>
  <rect x="668" y="642" width="304" height="36" rx="8" fill="#FEE2E2"/>
  <text x="684" y="665" class="tiny" fill="#B91C1C">Incorrect email or password.</text>
  <text x="668" y="706" class="tiny muted">Inline field error below the input; button shows loading.</text>

  <!-- Register card -->
  <rect x="1036" y="140" width="368" height="620" rx="16" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.9" filter="url(#glassShadow)"/>
  <text x="1068" y="204" class="h2">Create account</text>
  <text x="1068" y="232" class="base muted">Start with one course. Add material next.</text>

  <text x="1068" y="272" class="sm semibold">Name</text>
  <rect x="1068" y="284" width="304" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.72" stroke="#CBD5E1"/>
  <text x="1084" y="311" class="base ph">Ishan Jatain</text>

  <text x="1068" y="352" class="sm semibold">Email</text>
  <rect x="1068" y="364" width="304" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.72" stroke="#CBD5E1"/>
  <text x="1084" y="391" class="base ph">you@example.com</text>

  <text x="1068" y="432" class="sm semibold">Password</text>
  <rect x="1068" y="444" width="304" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.72" stroke="#CBD5E1"/>
  <text x="1084" y="471" class="base ph">••••••••</text>
  <text x="1068" y="510" class="tiny muted">At least 8 characters.</text>

  <rect x="1068" y="534" width="304" height="44" rx="10" fill="#4F46E5"/>
  <text x="1220" y="561" text-anchor="middle" font-size="14" font-weight="600" class="white">Create account</text>

  <text x="1220" y="612" text-anchor="middle" class="sm muted">Already have an account? <tspan class="link">Sign in</tspan></text>

  <rect x="1068" y="646" width="304" height="72" rx="10" fill="#EEF2FF"/>
  <text x="1084" y="672" class="tiny semibold" fill="#4F46E5">After register</text>
  <text x="1084" y="690" class="tiny" fill="#4338CA">Session is created immediately</text>
  <text x="1084" y="706" class="tiny" fill="#4338CA">and the student lands in chat.</text>

  <text x="1404" y="880" text-anchor="end" class="tiny muted">WF-1 · Login / Register · 1440 x 900</text>
</svg>
