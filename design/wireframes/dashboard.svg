<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">EduAssist wireframe: dashboard</title>
  <desc id="wfDesc">Summary tiles, mastery bar chart, topic table and rule-based recommendations.</desc>
  <style>
    text { font-family: Inter, 'Segoe UI', system-ui, sans-serif; fill: #334155; }
    .muted { fill: #475569; }
    .tiny { font-size: 11px; }
    .sm { font-size: 12px; }
    .base { font-size: 14px; }
    .h2 { font-size: 18px; font-weight: 600; fill: #0F172A; }
    .value { font-size: 24px; font-weight: 600; fill: #0F172A; }
    .semibold { font-weight: 600; }
    .white { fill: #FFFFFF; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="0.5" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="blob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <g filter="url(#blob)" opacity="0.55">
    <circle cx="1150" cy="110" r="230" fill="#A5B4FC"/>
    <circle cx="390" cy="800" r="250" fill="#7DD3FC"/>
    <circle cx="900" cy="470" r="260" fill="#C4B5FD"/>
  </g>

  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="900" fill="#FFFFFF" fill-opacity="0.50"/>
  <line x1="240" y1="0" x2="240" y2="900" stroke="#E2E8F0"/>
  <rect x="24" y="22" width="28" height="28" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-opacity="0.12"/>
  <path d="M33.4 30.75h9.1M33.4 41.25h9.1M33.4 30.75v10.5" fill="none" stroke="#0F172A" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M33.4 36h6.7" fill="none" stroke="#4F46E5" stroke-width="1.7" stroke-linecap="round"/>
  <text x="62" y="42" font-size="16" font-weight="600" fill="#0F172A">EduAssist</text>

  <rect x="28" y="115" width="18" height="18" rx="5" fill="#CBD5E1"/>
  <text x="58" y="129" class="base">Chat</text>
  <rect x="28" y="163" width="18" height="18" rx="5" fill="#CBD5E1"/>
  <text x="58" y="177" class="base">Library</text>
  <rect x="16" y="200" width="208" height="40" rx="10" fill="#EEF2FF"/>
  <rect x="28" y="211" width="18" height="18" rx="5" fill="#4F46E5"/>
  <text x="58" y="225" class="base semibold" fill="#4F46E5">Dashboard</text>
  <rect x="28" y="259" width="18" height="18" rx="5" fill="#CBD5E1"/>
  <text x="58" y="273" class="base">Planner</text>
  <rect x="28" y="307" width="18" height="18" rx="5" fill="#CBD5E1"/>
  <text x="58" y="321" class="base">Settings</text>

  <line x1="16" y1="812" x2="224" y2="812" stroke="#E2E8F0"/>
  <circle cx="36" cy="844" r="16" fill="#CBD5E1"/>
  <text x="62" y="840" class="sm semibold">Ishan Jatain</text>
  <text x="62" y="860" class="tiny muted">Log out</text>

  <!-- Top bar -->
  <rect x="240" y="0" width="1200" height="64" fill="#FFFFFF" fill-opacity="0.55"/>
  <line x1="240" y1="64" x2="1440" y2="64" stroke="#E2E8F0"/>
  <text x="272" y="40" class="h2">Dashboard</text>
  <text x="1232" y="38" text-anchor="end" class="tiny muted">Updated just now</text>

  <!-- Tiles -->
  <rect x="272" y="96" width="228" height="88" rx="14" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.9" filter="url(#glassShadow)"/>
  <text x="292" y="124" class="sm muted">Topics tracked</text>
  <text x="292" y="162" class="value">8</text>

  <rect x="516" y="96" width="228" height="88" rx="14" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.9" filter="url(#glassShadow)"/>
  <text x="536" y="124" class="sm muted">Weak</text>
  <text x="536" y="162" class="value" fill="#DC2626">2</text>

  <rect x="760" y="96" width="228" height="88" rx="14" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.9" filter="url(#glassShadow)"/>
  <text x="780" y="124" class="sm muted">Strong</text>
  <text x="780" y="162" class="value" fill="#15803D">3</text>

  <rect x="1004" y="96" width="228" height="88" rx="14" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.9" filter="url(#glassShadow)"/>
  <text x="1024" y="124" class="sm muted">Average mastery</text>
  <text x="1024" y="162" class="value">61%</text>

  <!-- Chart -->
  <rect x="272" y="200" width="960" height="260" rx="16" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.9" filter="url(#glassShadow)"/>
  <text x="296" y="232" class="base semibold">Mastery by topic</text>

  <circle cx="986" cy="228" r="5" fill="#DC2626"/>
  <text x="998" y="232" class="tiny muted">Weak</text>
  <circle cx="1052" cy="228" r="5" fill="#D97706"/>
  <text x="1064" y="232" class="tiny muted">Developing</text>
  <circle cx="1150" cy="228" r="5" fill="#16A34A"/>
  <text x="1162" y="232" class="tiny muted">Strong</text>

  <line x1="320" y1="420" x2="1208" y2="420" stroke="#E2E8F0"/>
  <line x1="320" y1="380" x2="1208" y2="380" stroke="#F1F5F9"/>
  <line x1="320" y1="340" x2="1208" y2="340" stroke="#F1F5F9"/>
  <line x1="320" y1="300" x2="1208" y2="300" stroke="#F1F5F9"/>
  <line x1="320" y1="260" x2="1208" y2="260" stroke="#F1F5F9"/>
  <text x="306" y="424" text-anchor="end" class="tiny muted">0</text>
  <text x="306" y="384" text-anchor="end" class="tiny muted">25</text>
  <text x="306" y="344" text-anchor="end" class="tiny muted">50</text>
  <text x="306" y="304" text-anchor="end" class="tiny muted">75</text>
  <text x="306" y="264" text-anchor="end" class="tiny muted">100</text>

  <!-- Bars -->
  <rect x="340" y="364" width="56" height="56" rx="4" fill="#DC2626"/>
  <text x="368" y="356" text-anchor="middle" class="tiny muted">35</text>
  <text x="368" y="438" text-anchor="middle" class="tiny muted">GD</text>

  <rect x="448" y="289" width="56" height="131" rx="4" fill="#16A34A"/>
  <text x="476" y="281" text-anchor="middle" class="tiny muted">82</text>
  <text x="476" y="438" text-anchor="middle" class="tiny muted">BP</text>

  <rect x="556" y="375" width="56" height="45" rx="4" fill="#DC2626"/>
  <text x="584" y="367" text-anchor="middle" class="tiny muted">28</text>
  <text x="584" y="438" text-anchor="middle" class="tiny muted">Reg</text>

  <rect x="664" y="318" width="56" height="102" rx="4" fill="#D97706"/>
  <text x="692" y="310" text-anchor="middle" class="tiny muted">64</text>
  <text x="692" y="438" text-anchor="middle" class="tiny muted">Opt</text>

  <rect x="772" y="274" width="56" height="146" rx="4" fill="#16A34A"/>
  <text x="800" y="266" text-anchor="middle" class="tiny muted">91</text>
  <text x="800" y="438" text-anchor="middle" class="tiny muted">CNN</text>

  <rect x="880" y="343" width="56" height="77" rx="4" fill="#D97706"/>
  <text x="908" y="335" text-anchor="middle" class="tiny muted">48</text>
  <text x="908" y="438" text-anchor="middle" class="tiny muted">RNN</text>

  <rect x="988" y="305" width="56" height="115" rx="4" fill="#16A34A"/>
  <text x="1016" y="297" text-anchor="middle" class="tiny muted">72</text>
  <text x="1016" y="438" text-anchor="middle" class="tiny muted">Attn</text>

  <rect x="1096" y="332" width="56" height="88" rx="4" fill="#D97706"/>
  <text x="1124" y="324" text-anchor="middle" class="tiny muted">55</text>
  <text x="1124" y="438" text-anchor="middle" class="tiny muted">Eval</text>

  <!-- Topic table -->
  <rect x="272" y="480" width="620" height="340" rx="16" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.9" filter="url(#glassShadow)"/>
  <text x="296" y="512" class="base semibold">Topics</text>
  <text x="868" y="511" text-anchor="end" class="tiny muted">5 of 8 shown</text>

  <text x="296" y="544" class="tiny muted">Topic</text>
  <text x="480" y="544" class="tiny muted">Mastery</text>
  <text x="566" y="544" class="tiny muted">Attempts</text>
  <text x="654" y="544" class="tiny muted">Last</text>
  <text x="726" y="544" class="tiny muted">Status</text>
  <line x1="296" y1="556" x2="868" y2="556" stroke="#E2E8F0"/>

  <text x="296" y="582" class="sm semibold">Gradient descent</text>
  <text x="480" y="582" class="sm">35%</text>
  <text x="580" y="582" class="sm">3</text>
  <text x="660" y="582" class="sm">32%</text>
  <rect x="720" y="566" width="88" height="22" rx="11" fill="#FEE2E2"/>
  <text x="764" y="581" text-anchor="middle" class="tiny" fill="#B91C1C">● Weak</text>
  <line x1="296" y1="596" x2="868" y2="596" stroke="#F1F5F9"/>

  <text x="296" y="622" class="sm semibold">Backpropagation</text>
  <text x="480" y="622" class="sm">82%</text>
  <text x="580" y="622" class="sm">4</text>
  <text x="660" y="622" class="sm">88%</text>
  <rect x="720" y="606" width="96" height="22" rx="11" fill="#DCFCE7"/>
  <text x="768" y="621" text-anchor="middle" class="tiny" fill="#15803D">● Strong</text>
  <line x1="296" y1="636" x2="868" y2="636" stroke="#F1F5F9"/>

  <text x="296" y="662" class="sm semibold">Regularization</text>
  <text x="480" y="662" class="sm">28%</text>
  <text x="580" y="662" class="sm">2</text>
  <text x="660" y="662" class="sm">26%</text>
  <rect x="720" y="646" width="88" height="22" rx="11" fill="#FEE2E2"/>
  <text x="764" y="661" text-anchor="middle" class="tiny" fill="#B91C1C">● Weak</text>
  <line x1="296" y1="676" x2="868" y2="676" stroke="#F1F5F9"/>

  <text x="296" y="702" class="sm semibold">Optimizers</text>
  <text x="480" y="702" class="sm">64%</text>
  <text x="580" y="702" class="sm">2</text>
  <text x="660" y="702" class="sm">64%</text>
  <rect x="720" y="686" width="116" height="22" rx="11" fill="#FEF3C7"/>
  <text x="778" y="701" text-anchor="middle" class="tiny" fill="#B45309">● Developing</text>
  <line x1="296" y1="716" x2="868" y2="716" stroke="#F1F5F9"/>

  <text x="296" y="742" class="sm semibold">Evaluation metrics</text>
  <text x="480" y="742" class="sm">—</text>
  <text x="580" y="742" class="sm">0</text>
  <text x="660" y="742" class="sm">—</text>
  <rect x="720" y="726" width="96" height="22" rx="11" fill="#F1F5F9"/>
  <text x="768" y="741" text-anchor="middle" class="tiny" fill="#475569">○ Untested</text>

  <text x="296" y="796" class="tiny muted">Mastery follows the A12 formula: 0.6 x new score + 0.4 x old.</text>

  <!-- Recommendations -->
  <rect x="912" y="480" width="320" height="340" rx="16" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.9" filter="url(#glassShadow)"/>
  <text x="936" y="512" class="base semibold">Recommendations</text>

  <circle cx="948" cy="552" r="12" fill="#FEE2E2"/>
  <text x="948" y="557" text-anchor="middle" class="tiny" fill="#B91C1C">!</text>
  <text x="972" y="548" class="sm semibold">Revise backpropagation</text>
  <text x="972" y="566" class="tiny muted">Scored below 40% twice.</text>
  <rect x="1148" y="538" width="36" height="20" rx="10" fill="#F1F5F9"/>
  <text x="1166" y="552" text-anchor="middle" font-size="10" fill="#64748B">R1</text>
  <line x1="936" y1="588" x2="1208" y2="588" stroke="#F1F5F9"/>

  <circle cx="948" cy="628" r="12" fill="#FEF3C7"/>
  <text x="948" y="633" text-anchor="middle" class="tiny" fill="#B45309">↑</text>
  <text x="972" y="624" class="sm semibold">Start with calculus</text>
  <text x="972" y="642" class="tiny muted">Its prerequisite is weak.</text>
  <rect x="1148" y="614" width="36" height="20" rx="10" fill="#F1F5F9"/>
  <text x="1166" y="628" text-anchor="middle" font-size="10" fill="#64748B">R3</text>
  <line x1="936" y1="664" x2="1208" y2="664" stroke="#F1F5F9"/>

  <circle cx="948" cy="704" r="12" fill="#E0F2FE"/>
  <text x="948" y="709" text-anchor="middle" class="tiny" fill="#0369A1">?</text>
  <text x="972" y="700" class="sm semibold">Test evaluation metrics</text>
  <text x="972" y="718" class="tiny muted">No attempts yet. Take a quiz.</text>
  <rect x="1148" y="690" width="36" height="20" rx="10" fill="#F1F5F9"/>
  <text x="1166" y="704" text-anchor="middle" font-size="10" fill="#64748B">R2</text>

  <text x="936" y="784" class="tiny muted">Each item explains why, with its rule id.</text>

  <text x="1404" y="880" text-anchor="end" class="tiny muted">WF-4 · Dashboard · 1440 x 900</text>
</svg>
