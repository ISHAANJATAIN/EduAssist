<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">EduAssist wireframe: library</title>
  <desc id="wfDesc">Upload dropzone, document list with processing states, and topic editor with prerequisites.</desc>
  <style>
    text { font-family: Inter, 'Segoe UI', system-ui, sans-serif; fill: #334155; }
    .muted { fill: #475569; }
    .tiny { font-size: 11px; }
    .sm { font-size: 12px; }
    .base { font-size: 14px; }
    .h2 { font-size: 18px; font-weight: 600; fill: #0F172A; }
    .semibold { font-weight: 600; }
    .white { fill: #FFFFFF; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="0.5" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="blob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <g filter="url(#blob)" opacity="0.55">
    <circle cx="1150" cy="110" r="230" fill="#A5B4FC"/>
    <circle cx="390" cy="800" r="250" fill="#7DD3FC"/>
    <circle cx="900" cy="470" r="260" fill="#C4B5FD"/>
  </g>

  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="900" fill="#FFFFFF" fill-opacity="0.50"/>
  <line x1="240" y1="0" x2="240" y2="900" stroke="#E2E8F0"/>
  <rect x="24" y="22" width="28" height="28" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-opacity="0.12"/>
  <path d="M33.4 30.75h9.1M33.4 41.25h9.1M33.4 30.75v10.5" fill="none" stroke="#0F172A" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M33.4 36h6.7" fill="none" stroke="#4F46E5" stroke-width="1.7" stroke-linecap="round"/>
  <text x="62" y="42" font-size="16" font-weight="600" fill="#0F172A">EduAssist</text>

  <rect x="28" y="115" width="18" height="18" rx="5" fill="#CBD5E1"/>
  <text x="58" y="129" class="base">Chat</text>
  <rect x="16" y="152" width="208" height="40" rx="10" fill="#EEF2FF"/>
  <rect x="28" y="163" width="18" height="18" rx="5" fill="#4F46E5"/>
  <text x="58" y="177" class="base semibold" fill="#4F46E5">Library</text>
  <rect x="28" y="211" width="18" height="18" rx="5" fill="#CBD5E1"/>
  <text x="58" y="225" class="base">Dashboard</text>
  <rect x="28" y="259" width="18" height="18" rx="5" fill="#CBD5E1"/>
  <text x="58" y="273" class="base">Planner</text>
  <rect x="28" y="307" width="18" height="18" rx="5" fill="#CBD5E1"/>
  <text x="58" y="321" class="base">Settings</text>

  <line x1="16" y1="812" x2="224" y2="812" stroke="#E2E8F0"/>
  <circle cx="36" cy="844" r="16" fill="#CBD5E1"/>
  <text x="62" y="840" class="sm semibold">Ishan Jatain</text>
  <text x="62" y="860" class="tiny muted">Log out</text>

  <!-- Top bar -->
  <rect x="240" y="0" width="1200" height="64" fill="#FFFFFF" fill-opacity="0.55"/>
  <line x1="240" y1="64" x2="1440" y2="64" stroke="#E2E8F0"/>
  <text x="272" y="40" class="h2">Library</text>
  <rect x="1100" y="16" width="132" height="32" rx="8" fill="#4F46E5"/>
  <text x="1166" y="37" text-anchor="middle" class="sm semibold white">Upload material</text>

  <!-- Dropzone -->
  <rect x="272" y="96" width="960" height="150" rx="16" fill="#FFFFFF" fill-opacity="0.72" stroke="#CBD5E1" stroke-dasharray="8 6"/>
  <circle cx="320" cy="156" r="20" fill="#EEF2FF"/>
  <path d="M320 164v-14m0 0l-5 5m5-5l5 5" stroke="#4F46E5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="356" y="152" class="lg semibold">Drop files here or browse</text>
  <text x="356" y="174" class="sm muted">PDF, PPTX, DOCX, TXT, MD · up to 25 MB per file</text>

  <text x="936" y="134" class="tiny muted">Document type</text>
  <rect x="936" y="144" width="264" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.72" stroke="#CBD5E1"/>
  <text x="952" y="169" class="base">Lecture</text>
  <path d="M1176 160l6 6 6-6" stroke="#64748B" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- Documents card -->
  <rect x="272" y="272" width="620" height="520" rx="16" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.9" filter="url(#glassShadow)"/>
  <text x="296" y="306" class="base semibold">Documents</text>
  <rect x="392" y="290" width="26" height="20" rx="10" fill="#F1F5F9"/>
  <text x="405" y="304" text-anchor="middle" class="tiny muted">4</text>

  <!-- Row 1 -->
  <rect x="296" y="324" width="24" height="24" rx="6" fill="#EEF2FF"/>
  <text x="308" y="341" text-anchor="middle" class="tiny" fill="#4F46E5">PDF</text>
  <text x="332" y="336" class="sm semibold">lecture3_gradient_descent.pdf</text>
  <text x="332" y="356" class="tiny muted">lecture · 12 pages · 48 chunks</text>
  <rect x="744" y="332" width="76" height="24" rx="12" fill="#DCFCE7"/>
  <text x="782" y="348" text-anchor="middle" class="tiny" fill="#15803D">Ready</text>
  <g transform="translate(853,335)" stroke="#94A3B8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 5h14M7 5V3h4v2M5 5l.7 12h6.6L13 5M9 8.5v6M12 8.5v6"/>
  </g>
  <line x1="296" y1="376" x2="868" y2="376" stroke="#F1F5F9"/>

  <!-- Row 2 -->
  <rect x="296" y="412" width="24" height="24" rx="6" fill="#F1F5F9"/>
  <text x="308" y="429" text-anchor="middle" class="tiny" fill="#64748B">PPT</text>
  <text x="332" y="424" class="sm semibold">unit2_slides.pptx</text>
  <text x="332" y="444" class="tiny muted">slides · 24 pages · processing…</text>
  <rect x="744" y="420" width="96" height="24" rx="12" fill="#FEF3C7"/>
  <circle cx="760" cy="432" r="5" fill="none" stroke="#B45309" stroke-width="1.6" stroke-dasharray="12 6"/>
  <text x="792" y="436" text-anchor="middle" class="tiny" fill="#B45309">Processing</text>
  <line x1="296" y1="464" x2="868" y2="464" stroke="#F1F5F9"/>

  <!-- Row 3 -->
  <rect x="296" y="500" width="24" height="24" rx="6" fill="#EEF2FF"/>
  <text x="308" y="517" text-anchor="middle" class="tiny" fill="#4F46E5">TXT</text>
  <text x="332" y="512" class="sm semibold">syllabus.txt</text>
  <text x="332" y="532" class="tiny muted">handout · 2 pages · 6 chunks</text>
  <rect x="744" y="508" width="76" height="24" rx="12" fill="#DCFCE7"/>
  <text x="782" y="524" text-anchor="middle" class="tiny" fill="#15803D">Ready</text>
  <g transform="translate(853,511)" stroke="#94A3B8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 5h14M7 5V3h4v2M5 5l.7 12h6.6L13 5M9 8.5v6M12 8.5v6"/>
  </g>

  <!-- Row 4 (failed) -->
  <line x1="296" y1="552" x2="868" y2="552" stroke="#F1F5F9"/>
  <rect x="296" y="576" width="24" height="24" rx="6" fill="#FEE2E2"/>
  <text x="308" y="593" text-anchor="middle" class="tiny" fill="#B91C1C">PDF</text>
  <text x="332" y="588" class="sm semibold">old_notes_scan.pdf</text>
  <text x="332" y="608" class="tiny" fill="#B91C1C">No readable text found. Re-upload a text-based file.</text>
  <rect x="744" y="584" width="76" height="24" rx="12" fill="#FEE2E2"/>
  <text x="782" y="600" text-anchor="middle" class="tiny" fill="#B91C1C">Failed</text>

  <text x="296" y="756" class="tiny muted">Files are listed newest first. Processing rows refresh every 2 seconds.</text>

  <!-- Topic editor -->
  <rect x="912" y="272" width="320" height="520" rx="16" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.9" filter="url(#glassShadow)"/>
  <text x="936" y="306" class="base semibold">Topics</text>
  <text x="1208" y="306" text-anchor="end" class="sm" fill="#4F46E5">+ Add</text>

  <text x="936" y="336" class="tiny muted">Extracted from syllabus.txt · editable</text>

  <rect x="936" y="352" width="272" height="58" rx="10" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.8"/>
  <text x="950" y="374" class="sm semibold">Gradient descent</text>
  <rect x="950" y="384" width="104" height="18" rx="9" fill="#EEF2FF"/>
  <text x="1002" y="397" text-anchor="middle" font-size="10" fill="#4F46E5">needs: Calculus</text>

  <rect x="936" y="420" width="272" height="58" rx="10" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.8"/>
  <text x="950" y="442" class="sm semibold">Backpropagation</text>
  <rect x="950" y="452" width="150" height="18" rx="9" fill="#EEF2FF"/>
  <text x="1025" y="465" text-anchor="middle" font-size="10" fill="#4F46E5">needs: Gradient descent</text>

  <rect x="936" y="488" width="272" height="58" rx="10" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.8"/>
  <text x="950" y="510" class="sm semibold">Regularization</text>
  <rect x="950" y="520" width="132" height="18" rx="9" fill="#EEF2FF"/>
  <text x="1016" y="533" text-anchor="middle" font-size="10" fill="#4F46E5">needs: Linear models</text>

  <rect x="936" y="556" width="272" height="58" rx="10" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.8"/>
  <text x="950" y="578" class="sm semibold">Optimizers</text>
  <rect x="950" y="588" width="150" height="18" rx="9" fill="#EEF2FF"/>
  <text x="1025" y="601" text-anchor="middle" font-size="10" fill="#4F46E5">needs: Gradient descent</text>

  <rect x="936" y="640" width="272" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.72" stroke="#4F46E5"/>
  <text x="1072" y="665" text-anchor="middle" class="sm semibold" fill="#4F46E5">Extract topics from handout</text>

  <rect x="936" y="696" width="272" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.72" stroke="#CBD5E1"/>
  <text x="1072" y="721" text-anchor="middle" class="sm">+ Add topic manually</text>

  <text x="936" y="764" class="tiny muted">Prerequisites feed the planner order.</text>

  <text x="1404" y="880" text-anchor="end" class="tiny muted">WF-3 · Library · 1440 x 900</text>
</svg>
